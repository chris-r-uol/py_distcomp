name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result rather than cancelling the rest on the
      # first failure; the point is to see which versions disagree.
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # The dev extra is the documented development install, so exercising it
        # here also checks that it still works.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show resolved dependency versions
        # The suite pins numbers against R's published output, so when a run
        # goes red the numeric stack is the first thing worth seeing.
        run: python -m pip list

      - name: Run tests
        run: python -m pytest -v --durations=10

  package:
    name: build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl

      - name: Import it from outside the source tree
        # Guards the failure mode that shipped an empty wheel: run from
        # elsewhere so the checkout cannot satisfy the import.
        working-directory: /tmp
        run: |
          /tmp/check/bin/python -c "
          import py_distcomp
          assert 'site-packages' in py_distcomp.__file__, py_distcomp.__file__
          missing = [n for n in py_distcomp.__all__ if not hasattr(py_distcomp, n)]
          assert not missing, missing
          print('ok:', py_distcomp.__version__, len(py_distcomp.__all__), 'exports')
          "
