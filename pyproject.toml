[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py_distcomp"
version = "0.10.0"
description = "Distribution fitting and comparison in Python, following R's fitdistrplus"
readme = { file = "readme.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "Chris Rushton", email = "c.e.rushton@leeds.ac.uk" },
]
keywords = [
    "statistics",
    "distribution",
    "fitting",
    "visualization",
    "qq-plot",
    "probability",
    "fitdistrplus",
    "mixture-model",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "plotly>=5.0.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
# Only the demo app needs streamlit; the library itself does not.
app = ["streamlit>=1.0.0"]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "scikit-learn>=1.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
]

[project.urls]
Homepage = "https://github.com/chris-r-uol/py_distcomp"
Source = "https://github.com/chris-r-uol/py_distcomp"
Documentation = "https://github.com/chris-r-uol/py_distcomp#readme"
"Bug Reports" = "https://github.com/chris-r-uol/py_distcomp/issues"

[project.scripts]
py-distcomp-demo = "py_distcomp._cli:main"

[tool.setuptools.packages.find]
# Only the package itself; the repo root also holds app.py, examples.py and
# the legacy single-distribution module, none of which should be installed.
include = ["py_distcomp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
